name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: test
        run: make test
      - name: install self-check
        run: bash install.sh --self-check
      - name: sanitize
        run: make clean && make test SANITIZE=1
