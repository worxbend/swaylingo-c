name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: skbd-linux-amd64
            cc: cc
            test: "1"
          - asset: skbd-linux-arm64
            cc: aarch64-linux-gnu-gcc
            test: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install the arm compiler
        if: matrix.test != '1'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: test
        if: matrix.test == '1'
        run: make test
      - name: build
        env:
          SKBD_CC: ${{ matrix.cc }}
          SKBD_ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          make CC="$SKBD_CC" bin/skbd
          cp bin/skbd "$SKBD_ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: false
      - name: checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          stage="${RUNNER_TEMP}/release"
          mkdir -p "$stage"
          cp dist/skbd-linux-amd64/skbd-linux-amd64 "$stage/"
          cp dist/skbd-linux-arm64/skbd-linux-arm64 "$stage/"
          cp man/skbd.1 "$stage/"
          (
            cd "$stage"
            sha256sum skbd-linux-amd64 skbd-linux-arm64 skbd.1 > SHA256SUMS
          )
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "C binaries for Linux amd64 and arm64. Copy the matching file to ~/.local/bin/skbd. The man page is skbd.1. SHA256SUMS covers those three files. install.sh in the repository installs a local make build, the user unit, and the man page. The unit is not enabled." \
            "$stage/skbd-linux-amd64" \
            "$stage/skbd-linux-arm64" \
            "$stage/SHA256SUMS" \
            "$stage/skbd.1"
